name: Build

# Every push and pull request: build a debug APK and run the tests.
# A tag like v0.1.0: build a signed release APK and attach it to a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and debug build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: HyperDebloat-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Signed release build
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          HD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is missing. See 'Releasing' in the README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export HD_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew testDebugUnitTest assembleRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          mv app/build/outputs/apk/release/app-release.apk "HyperDebloat-$VERSION.apk"

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: HyperDebloat-*.apk
          generate_release_notes: true
